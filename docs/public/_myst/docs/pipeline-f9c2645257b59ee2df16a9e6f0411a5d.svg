<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 900 150" width="900" height="150" font-family="system-ui, sans-serif">
  <title>Pipeline: MyST sources are compiled by mystmd, rendered by astro-myst and served by Astro</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6672"/></marker></defs>
  <g fill="#ffffff" stroke="#1f5f8b" stroke-width="1.5">
    <rect x="5" y="40" width="180" height="76" rx="10"/>
    <rect x="243" y="40" width="180" height="76" rx="10"/>
    <rect x="481" y="40" width="180" height="76" rx="10"/>
    <rect x="719" y="40" width="176" height="76" rx="10"/>
  </g>
  <g fill="#1c2126" text-anchor="middle" font-size="16" font-weight="600">
    <text x="95" y="72">MyST sources</text>
    <text x="333" y="72">mystmd</text>
    <text x="571" y="72">astro-myst</text>
    <text x="807" y="72">Astro</text>
  </g>
  <g fill="#5b6672" text-anchor="middle" font-size="12.5">
