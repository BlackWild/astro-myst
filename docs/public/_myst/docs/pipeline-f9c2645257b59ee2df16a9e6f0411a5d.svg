    <text x="571" y="96">HTML · URLs · assets</text>
    <text x="807" y="96">your layout &amp; routes</text>
  </g>
  <g stroke="#5b6672" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="187" y1="78" x2="240" y2="78"/><line x1="425" y1="78" x2="478" y2="78"/><line x1="663" y1="78" x2="716" y2="78"/>
  </g>
  <g fill="#5b6672" text-anchor="middle" font-size="11.5">
    <text x="214" y="30">build</text><text x="452" y="30">page AST</text><text x="690" y="30">entries</text>
  </g>
</svg>
