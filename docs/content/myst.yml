version: 1
project:
  title: astro-myst
  description: MyST Markdown for Astro, compiled by the official mystmd engine.
  github: https://github.com/BlackWild/astro-myst
  license: MIT
  bibliography:
    - references.bib
  abbreviations:
    AST: abstract syntax tree
    SSG: static site generator
  toc:
    - file: index.md
    - file: getting-started.md
    - title: Guides
      children:
        - file: guides/writing-content.md
        - file: guides/routing-and-navigation.md
        - file: guides/styling.md
        - file: guides/latex.md
        - file: guides/citations.md
        - file: guides/notebooks.md
        - file: guides/custom-renderers.md
        - file: guides/multiple-projects.md
        - file: guides/deployment.md
    - title: Reference
      children:
        - file: reference/loader-options.md
        - file: reference/entry-data.md
        - file: reference/components-and-styles.md
        - file: reference/api.md
    - title: Explanation
      children:
        - file: explanation/how-it-works.md
        - file: explanation/comparison.md
        - file: explanation/limitations.md
    - title: Project
      children:
        - file: project/troubleshooting.md
        - file: project/changelog.md
        - file: project/contributing.md
site:
  options:
    folders: true
