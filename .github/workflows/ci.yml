name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: npx biome ci --reporter=github .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: npm run build
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and integration tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == '24') }}
        run: npm test
      - name: Unit and integration tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        run: |
          npm run test:coverage
          node -e "const s=require('./packages/astro-myst/coverage/coverage-summary.json').total;const r=['statements','branches','functions','lines'].map(k=>'| '+k+' | '+s[k].pct+'% |').join('\n');require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Coverage\n\n| metric | covered |\n|---|---|\n'+r+'\n')"
      - name: Upload coverage report
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: packages/astro-myst/coverage
          retention-days: 14

  package:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: npm run build
      - name: publint and Are the Types Wrong
        run: npm run check:package
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w astro-myst --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          retention-days: 14

  compat:
    name: Astro ${{ matrix.astro }} · mystmd ${{ matrix.mystmd }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { astro: '5', mystmd: latest }
          - { astro: '6', mystmd: latest }
          - { astro: '7', mystmd: latest }
          - { astro: '7', mystmd: '1.3' }
          - { astro: '7', mystmd: '1.8' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack
      - name: Build the book example outside the workspace
        env:
          ASTRO_VERSION: ${{ matrix.astro }}
          MYSTMD_VERSION: ${{ matrix.mystmd }}
        run: | # zizmor: ignore[adhoc-packages] -- installing specific versions is the point of this job
          site="$RUNNER_TEMP/site"
          cp -r examples/book "$site"
          cd "$site"
          npm pkg delete devDependencies dependencies.astro-myst
          npm install --no-audit --no-fund "astro@$ASTRO_VERSION" "mystmd@$MYSTMD_VERSION" "$RUNNER_TEMP"/pack/astro-myst-*.tgz
          npx astro build
          grep -q 'href="/theory#eq-schrodinger"' dist/results/index.html
          grep -q 'class="myst-equation-number">(1)<' dist/theory/index.html

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: npm run build
      - run: npm run examples:build
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          advanced-security: false

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
