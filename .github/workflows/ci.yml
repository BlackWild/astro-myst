name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run example:build

  astro-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ['5', '6', '7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Pack astro-myst
        run: npm pack -w astro-myst --pack-destination "$RUNNER_TEMP"
      - name: Build the example against Astro ${{ matrix.astro }}
        run: |
          cp -r examples/book "$RUNNER_TEMP/site" && cd "$RUNNER_TEMP/site"
          npm pkg delete devDependencies dependencies.astro-myst
          npm install "astro@${{ matrix.astro }}" mystmd "$RUNNER_TEMP"/astro-myst-*.tgz
          npx astro build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, astro-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish -w astro-myst
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
