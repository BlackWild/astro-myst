# Builds the documentation site (MyST rendered by astro-myst) and deploys it to GitHub Pages.
# Enable Pages once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docs/**
      - packages/astro-myst/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build
    # The "Version Packages" pull request only bumps versions; the docs (and their changelog page)
    # are rebuilt and deployed when it merges.
    if: ${{ github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: npm run build
      - run: npm run docs:build
      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Skipped (instead of failing) until GitHub Pages is enabled for the repository.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
