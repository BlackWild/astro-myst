version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing new releases (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      myst:
        patterns: ['mystmd']
      tooling:
        patterns: ['@biomejs/*', '@changesets/*', 'typescript', 'vitest', '@vitest/*', '@playwright/test', 'publint', '@arethetypeswrong/*', 'pagefind', '@types/*']
      runtime:
        patterns: ['hast-util-to-html', 'hastscript', 'shiki', 'yaml']
    ignore:
      # katex is pinned to the KaTeX version mystmd bundles (its CSS must match mystmd's math HTML),
      # so no version or security updates. packages/astro-myst/test/katex.test.ts fails on the
      # mystmd update that changes that version and names the katex version to pin.
      - dependency-name: katex
      # @astrojs/check supports TypeScript 5 and 6 only; move to 7 once it does
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Type definitions follow the oldest supported Node.js major
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
